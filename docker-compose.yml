name: corradi

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: corradi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corradi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corradi}
      POSTGRES_DB: ${POSTGRES_DB:-corradi}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Migraciones que se ejecutan SOLO en la primera inicialización del volumen
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Host 5433 para evitar choque con un Postgres local en 5432.
      # Dentro de la red de compose, api/bot siguen usando db:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corradi} -d ${POSTGRES_DB:-corradi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: corradi-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corradi}:${POSTGRES_PASSWORD:-corradi}@db:5432/${POSTGRES_DB:-corradi}
    volumes:
      # Compartido con `bot`: el bot genera el .mp4 del Reel (pesado, ffmpeg) y lo deja
      # aquí; la api solo lo sirve tal cual por GET /ig/{id}/reel.mp4 — nada de generar
      # vídeo bajo demanda en la ruta pública, sería demasiado lento para esa petición.
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    # Sin publicar el puerto al host: el acceso público pasa SIEMPRE por caddy, que filtra
    # las rutas. Para depurar en local: docker compose exec api ... o el túnel SSH.
    expose:
      - "8000"

  # Proxy inverso público: HTTPS automático (Let's Encrypt) y filtro de rutas.
  caddy:
    image: caddy:2-alpine
    container_name: corradi-caddy
    restart: unless-stopped
    environment:
      MAP_DOMAIN: ${MAP_DOMAIN:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificados: NO borrar, evita re-pedirlos a Let's Encrypt
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    container_name: corradi-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corradi}:${POSTGRES_PASSWORD:-corradi}@db:5432/${POSTGRES_DB:-corradi}
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  media_data:
