function esc(v){var d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}function fmt(v){return v?new Intl.DateTimeFormat("es",{day:"numeric",month:"long",year:"numeric"}).format(new Date(v+"T12:00:00")):"Por confirmar"}function image(o){return o.image_url||(o.type==="TRAINING_COURSE"?"/assets/category-training-course.jpg":"/assets/category-youth-exchange.jpg")}function section(t,v){return v?'<section class="section"><h2>'+esc(t)+'</h2><p>'+esc(v)+'</p></section>':""}function fact(k,v){return v?'<div class="fact"><small>'+esc(k)+'</small><strong>'+esc(v)+'</strong></div>':""}

function render(o){var place=[o.location,countries[o.country_code]||o.country_code].filter(Boolean).join(", ");var age=o.participant_min_age||o.participant_max_age?(o.participant_min_age||"—")+"–"+(o.participant_max_age||"+")+" años":"Consultar requisitos";var actions=(o.application_url?'<a class="button primary" href="'+esc(o.application_url)+'" target="_blank" rel="noopener">Solicitar plaza →</a>':"")+(o.infopack_url&&o.infopack_url!==o.application_url?'<a class="button" href="'+esc(o.infopack_url)+'" target="_blank" rel="noopener">Abrir infopack</a>':"")+(o.source_url&&o.source_url!==o.application_url?'<a class="button" href="'+esc(o.source_url)+'" target="_blank" rel="noopener">Ver fuente oficial</a>':"")+(o.channel_url?'<a class="button" href="'+esc(o.channel_url)+'" target="_blank" rel="noopener">Ver fuente original</a>':"");var sections=section("Sobre el proyecto",o.detailed_description||o.summary)+section("Programa y actividades",o.programme_details)+section("Qué aprenderás",o.learning_outcomes)+section("A quién buscan",o.participant_profile)+section("Países participantes",o.eligibility_countries)+section("Alojamiento y comidas",o.accommodation_details)+section("Qué está cubierto",o.covered_costs)+section("Viaje y reembolso",o.travel_details);document.title=(o.title||"Oportunidad")+" · Corradi";document.querySelector('meta[name="description"]').content=(o.summary||"Información completa de esta oportunidad Erasmus+").slice(0,155);document.getElementById("app").innerHTML='<section class="hero" style="background-image:url(&quot;'+esc(image(o))+'&quot;)"><div class="wrap hero-inner"><a class="crumb" href="/">← Todas las oportunidades</a><br><span class="badge">'+esc(types[o.type]||"Oportunidad Erasmus+")+'</span><h1>'+esc(o.title)+'</h1><p class="lead">'+esc(o.summary||"Descubre toda la información de este proyecto.")+'</p></div>'+(o.image_credit?'<a class="credit" href="'+esc(o.image_source_url||"#")+'" target="_blank" rel="noopener">'+esc(o.image_credit)+'</a>':"")+'</section><div class="wrap layout"><article><div class="facts">'+fact("Destino",place||"Por confirmar")+fact("Fechas",fmt(o.start_date)+" — "+fmt(o.end_date))+fact("Participantes",age)+fact("Organiza",o.organiser_name)+fact("Coste",o.cost)+fact("Temas",o.topic)+'</div>'+(sections||'<div class="empty-note">La descripción ampliada todavía no está disponible. Consulta el infopack o la fuente original para todos los detalles.</div>')+'</article><aside class="side"><div class="apply-card"><div class="deadline"><small>Fecha límite</small><strong>'+esc(fmt(o.application_deadline))+(o.deadline_estimated?" · estimada":"")+'</strong></div>'+actions+'<div class="trust"><b>✓</b><span>'+(o.source_checked_at?"Abierta en el Portal Europeo de la Juventud y comprobada por Corradi.":o.infopack_enriched?"Información ampliada desde el infopack oficial.":"Datos estructurados por Corradi. Comprueba los requisitos finales en la fuente oficial.")+'</span></div><a class="back" href="/mapa?o='+encodeURIComponent(o.identifier)+'">Ver en el mapa →</a></div></aside></div>'}
var baseRender=render;
render=function(o){baseRender(o);var facts=document.querySelector(".facts");if(facts&&o.type==="VOLUNTEERING"&&durationLabel(o))facts.insertAdjacentHTML("beforeend",fact("Duración",durationLabel(o)));document.querySelectorAll(".section h2").forEach(function(h){if(h.textContent==="Qué está cubierto")h.textContent="Costes y cobertura"});var article=document.querySelector(".layout article");if(o.contact_information&&article)article.insertAdjacentHTML("beforeend",section("Contacto",o.contact_information));var source=Array.from(document.querySelectorAll(".apply-card .button")).find(function(a){return a.textContent.indexOf("fuente original")>=0});if(source)source.remove();var card=document.querySelector(".apply-card");if(card){var trust=card.querySelector(".trust");trust.insertAdjacentHTML("beforebegin",'<button class="button" id="shareProject" type="button">Compartir tarjeta</button>');document.getElementById("shareProject").onclick=function(){shareProject(o,this)}}};
function shareProject(o,b){var url=location.origin+"/"+o.identifier.replace("CORRADI-","");b.disabled=true;b.textContent="Preparando tarjeta…";fetch("/share/"+encodeURIComponent(o.identifier)+"/story.png").then(function(r){if(!r.ok)throw Error();return r.blob()}).then(function(blob){var f=new File([blob],"corradi-"+o.identifier.replace("CORRADI-","")+".png",{type:"image/png"});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]})))return navigator.share({title:o.title,text:"Mira esta oportunidad Erasmus+ en Corradi",url:url,files:[f]});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);if(navigator.clipboard)navigator.clipboard.writeText(url)}).catch(function(){if(navigator.share)navigator.share({title:o.title,url:url}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(url)}).then(function(){b.disabled=false;b.textContent="Compartir tarjeta"})}
function beacon(path,data){var body=JSON.stringify(data);if(navigator.sendBeacon)navigator.sendBeacon(path,new Blob([body],{type:"application/json"}));else fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:body,keepalive:true}).catch(function(){})}
var identifier=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"");fetch("/opportunities/"+encodeURIComponent(identifier)).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(o){render(o);beacon("/api/interaction",{identifier:o.identifier,kind:"view"})}).catch(function(){document.getElementById("app").innerHTML='<div class="loading">No hemos encontrado esta oportunidad.<br><a class="back" href="/">Volver al catálogo</a></div>'});

})();
