<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oportunidad Erasmus+ · Corradi</title>
<meta name="description" content="Información completa de esta oportunidad Erasmus+.">
<meta name="theme-color" content="#14265e">
<style>
@font-face{font-family:Sora;font-weight:400;src:url('/fonts/Sora-Regular.ttf')}@font-face{font-family:Sora;font-weight:600;src:url('/fonts/Sora-SemiBold.ttf')}@font-face{font-family:Sora;font-weight:700;src:url('/fonts/Sora-Bold.ttf')}@font-face{font-family:Manrope;font-weight:400;src:url('/fonts/Manrope-Regular.ttf')}@font-face{font-family:Manrope;font-weight:600;src:url('/fonts/Manrope-SemiBold.ttf')}@font-face{font-family:Manrope;font-weight:700;src:url('/fonts/Manrope-Bold.ttf')}
:root{--ink:#111318;--muted:#62666f;--paper:#f5f2eb;--white:#fff;--navy:#14265e;--lime:#d9f27e;--line:rgba(17,19,24,.11);--green:#316b4b;--red:#a7443e;--display:Sora,sans-serif;--body:Manrope,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--body);-webkit-font-smoothing:antialiased}a{color:inherit}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 16px var(--display)}.glyph{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff}.navlinks{display:flex;gap:22px;align-items:center}.navlinks a{text-decoration:none;font-size:13px;font-weight:700}.navlinks .publish{padding:10px 15px;background:var(--navy);color:#fff;border-radius:999px}
.hero{position:relative;min-height:540px;background:#243463 center/cover no-repeat;color:#fff;display:flex;align-items:end}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,15,40,.92),rgba(8,15,40,.52) 58%,rgba(8,15,40,.12)),linear-gradient(0deg,rgba(8,15,40,.35),transparent 50%)}.hero-inner{position:relative;z-index:1;padding:90px 0 64px}.crumb{font-size:12px;color:rgba(255,255,255,.72);text-decoration:none}.badge{display:inline-block;margin-top:34px;background:var(--lime);color:#17213e;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.hero h1{max-width:850px;margin:17px 0 14px;font:700 clamp(38px,6vw,70px)/1.03 var(--display);letter-spacing:-.05em}.lead{max-width:690px;color:rgba(255,255,255,.8);font-size:17px;margin:0}.credit{position:absolute;z-index:2;right:22px;bottom:15px;padding:5px 8px;background:rgba(5,10,24,.62);border-radius:7px;color:#fff;font-size:9px;text-decoration:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:54px;padding:58px 0 90px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:40px}.fact{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.fact small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.fact strong{display:block;margin-top:4px;font-size:14px}.section{padding:29px 0;border-top:1px solid var(--line)}.section:first-of-type{border:0;padding-top:0}.section h2{font:700 25px/1.2 var(--display);letter-spacing:-.03em;margin:0 0 12px}.section p{color:#4f535c;white-space:pre-line;margin:0;font-size:16px}.empty-note{padding:24px;background:#ebe7df;border-radius:16px;color:var(--muted)}
.side{position:relative}.apply-card{position:sticky;top:24px;background:#fff;border-radius:22px;padding:25px;box-shadow:0 18px 55px rgba(23,28,47,.11);border:1px solid var(--line)}.deadline{background:#f4e9e5;color:var(--red);border-radius:13px;padding:13px;margin-bottom:20px}.deadline small{display:block;text-transform:uppercase;font-size:9px;font-weight:700;letter-spacing:.08em}.deadline strong{font-family:var(--display)}.button{display:block;text-align:center;text-decoration:none;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:9px}.button.primary{background:var(--navy);border-color:var(--navy);color:#fff}.trust{display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.trust b{color:var(--green)}.back{display:inline-block;margin-top:18px;color:var(--navy);font-weight:700;text-decoration:none;font-size:12px}.loading{padding:22vh 20px;text-align:center;font:600 18px var(--display)}
@media(max-width:800px){.navlinks a:not(.publish){display:none}.hero{min-height:500px}.hero:after{background:linear-gradient(0deg,rgba(8,15,40,.94),rgba(8,15,40,.25))}.layout{grid-template-columns:1fr;gap:28px}.side{order:-1}.apply-card{position:static}.facts{grid-template-columns:1fr}.credit{right:10px}.wrap{width:min(100% - 26px,1160px)}}
.button[type="button"]{width:100%;font:700 13px var(--body);color:var(--ink);background:#fff;cursor:pointer}
</style>
</head>
<body>
<header class="wrap nav"><a class="brand" href="/"><span class="glyph">C</span>Corradi</a><nav class="navlinks"><a href="/">Oportunidades</a><a href="/mapa">Mapa</a><a class="publish" href="/publicar">Publicar</a></nav></header>
<main id="app"><div class="loading">Cargando oportunidad…</div></main>
<script>
(function(){"use strict";
var countries={ES:"España",IT:"Italia",RO:"Rumanía",GR:"Grecia",PL:"Polonia",DE:"Alemania",PT:"Portugal",FR:"Francia",HR:"Croacia",BG:"Bulgaria",HU:"Hungría",LT:"Lituania",LV:"Letonia",SK:"Eslovaquia",SI:"Eslovenia",EE:"Estonia",NL:"Países Bajos",BE:"Bélgica",CZ:"Chequia",AT:"Austria",SE:"Suecia",FI:"Finlandia",DK:"Dinamarca",MT:"Malta",IE:"Irlanda",CY:"Chipre",TR:"Turquía",MK:"Macedonia del Norte",RS:"Serbia",BA:"Bosnia y Herzegovina",AL:"Albania",ME:"Montenegro",GE:"Georgia",NO:"Noruega",IS:"Islandia",UA:"Ucrania",GB:"Reino Unido"};
var types={YOUTH_EXCHANGE:"Youth Exchange",TRAINING_COURSE:"Training Course",VOLUNTEERING:"ESC",ESC:"ESC"};
function esc(v){var d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}function fmt(v){return v?new Intl.DateTimeFormat("es",{day:"numeric",month:"long",year:"numeric"}).format(new Date(v+"T12:00:00")):"Por confirmar"}function image(o){return o.image_url||(o.type==="TRAINING_COURSE"?"/assets/category-training-course.jpg":"/assets/category-youth-exchange.jpg")}function section(t,v){return v?'<section class="section"><h2>'+esc(t)+'</h2><p>'+esc(v)+'</p></section>':""}function fact(k,v){return v?'<div class="fact"><small>'+esc(k)+'</small><strong>'+esc(v)+'</strong></div>':""}
function render(o){var place=[o.location,countries[o.country_code]||o.country_code].filter(Boolean).join(", ");var age=o.participant_min_age||o.participant_max_age?(o.participant_min_age||"—")+"–"+(o.participant_max_age||"+")+" años":"Consultar requisitos";var actions=(o.application_url?'<a class="button primary" href="'+esc(o.application_url)+'" target="_blank" rel="noopener">Solicitar plaza →</a>':"")+(o.infopack_url?'<a class="button" href="'+esc(o.infopack_url)+'" target="_blank" rel="noopener">Abrir infopack</a>':"")+(o.channel_url?'<a class="button" href="'+esc(o.channel_url)+'" target="_blank" rel="noopener">Ver fuente original</a>':"");var sections=section("Sobre el proyecto",o.detailed_description||o.summary)+section("Programa y actividades",o.programme_details)+section("Qué aprenderás",o.learning_outcomes)+section("A quién buscan",o.participant_profile)+section("Países participantes",o.eligibility_countries)+section("Alojamiento y comidas",o.accommodation_details)+section("Qué está cubierto",o.covered_costs)+section("Viaje y reembolso",o.travel_details);document.title=(o.title||"Oportunidad")+" · Corradi";document.querySelector('meta[name="description"]').content=(o.summary||"Información completa de esta oportunidad Erasmus+").slice(0,155);document.getElementById("app").innerHTML='<section class="hero" style="background-image:url(&quot;'+esc(image(o))+'&quot;)"><div class="wrap hero-inner"><a class="crumb" href="/">← Todas las oportunidades</a><br><span class="badge">'+esc(types[o.type]||"Oportunidad Erasmus+")+'</span><h1>'+esc(o.title)+'</h1><p class="lead">'+esc(o.summary||"Descubre toda la información de este proyecto.")+'</p></div>'+(o.image_credit?'<a class="credit" href="'+esc(o.image_source_url||"#")+'" target="_blank" rel="noopener">'+esc(o.image_credit)+'</a>':"")+'</section><div class="wrap layout"><article><div class="facts">'+fact("Destino",place||"Por confirmar")+fact("Fechas",fmt(o.start_date)+" — "+fmt(o.end_date))+fact("Participantes",age)+fact("Organiza",o.organiser_name)+fact("Coste",o.cost)+fact("Temas",o.topic)+'</div>'+(sections||'<div class="empty-note">La descripción ampliada todavía no está disponible. Consulta el infopack o la fuente original para todos los detalles.</div>')+'</article><aside class="side"><div class="apply-card"><div class="deadline"><small>Fecha límite</small><strong>'+esc(fmt(o.application_deadline))+(o.deadline_estimated?" · estimada":"")+'</strong></div>'+actions+'<div class="trust"><b>✓</b><span>'+(o.infopack_enriched?"Información ampliada desde el infopack oficial.":"Datos estructurados por Corradi. Comprueba los requisitos finales en la fuente oficial.")+'</span></div><a class="back" href="/mapa?o='+encodeURIComponent(o.identifier)+'">Ver en el mapa →</a></div></aside></div>'}
var baseRender=render;
render=function(o){baseRender(o);document.querySelectorAll(".section h2").forEach(function(h){if(h.textContent==="Qué está cubierto")h.textContent="Costes y cobertura"});var article=document.querySelector(".layout article");if(o.contact_information&&article)article.insertAdjacentHTML("beforeend",section("Contacto",o.contact_information));var source=Array.from(document.querySelectorAll(".apply-card .button")).find(function(a){return a.textContent.indexOf("fuente original")>=0});if(source)source.remove();var card=document.querySelector(".apply-card");if(card){var trust=card.querySelector(".trust");trust.insertAdjacentHTML("beforebegin",'<button class="button" id="shareProject" type="button">Compartir tarjeta</button>');document.getElementById("shareProject").onclick=function(){shareProject(o,this)}}};
function shareProject(o,b){var url=location.origin+"/"+o.identifier.replace("CORRADI-","");b.disabled=true;b.textContent="Preparando tarjeta…";fetch("/share/"+encodeURIComponent(o.identifier)+"/story.png").then(function(r){if(!r.ok)throw Error();return r.blob()}).then(function(blob){var f=new File([blob],"corradi-"+o.identifier.replace("CORRADI-","")+".png",{type:"image/png"});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]})))return navigator.share({title:o.title,text:"Mira esta oportunidad Erasmus+ en Corradi",url:url,files:[f]});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);if(navigator.clipboard)navigator.clipboard.writeText(url)}).catch(function(){if(navigator.share)navigator.share({title:o.title,url:url}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(url)}).then(function(){b.disabled=false;b.textContent="Compartir tarjeta"})}
function beacon(path,data){var body=JSON.stringify(data);if(navigator.sendBeacon)navigator.sendBeacon(path,new Blob([body],{type:"application/json"}));else fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:body,keepalive:true}).catch(function(){})}
var identifier=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"");fetch("/opportunities/"+encodeURIComponent(identifier)).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(o){render(o);beacon("/api/interaction",{identifier:o.identifier,kind:"view"})}).catch(function(){document.getElementById("app").innerHTML='<div class="loading">No hemos encontrado esta oportunidad.<br><a class="back" href="/">Volver al catálogo</a></div>'});
document.addEventListener("click",function(e){var a=e.target.closest(".apply-card a.button");if(!a)return;var text=a.textContent.toLowerCase(),kind=text.indexOf("infopack")>=0?"infopack":text.indexOf("solicitar")>=0?"form":"info";beacon("/api/click",{kind:kind,identifier:identifier})});
})();
</script>
</body>
</html>
